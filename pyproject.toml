[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mouse-lfp-analysis"
version = "0.1.0"
description = "Traceable LFP analysis for synchronized multi-region mouse tetrode recordings"
readme = "README.md"
requires-python = ">=3.11,<3.13"
authors = [{name = "Local analysis project"}]
dependencies = [
    "numpy>=1.26,<3",
    "scipy>=1.11,<2",
    "pandas>=2.1,<3",
    "matplotlib>=3.8,<4",
    "PyYAML>=6.0,<7",
    "mne>=1.6,<2",
]

[project.optional-dependencies]
connectivity = ["mne-connectivity>=0.7,<1"]
parameterization = ["specparam==2.0.0rc7", "fooof>=1.1,<2"]
notebook = ["jupyterlab>=4,<5", "nbformat>=5.9,<6", "ipykernel>=6.29,<7"]
dev = ["pytest>=8,<9", "ruff>=0.6,<1"]
all = [
    "mne-connectivity>=0.7,<1",
    "specparam==2.0.0rc7",
    "fooof>=1.1,<2",
    "jupyterlab>=4,<5",
    "nbformat>=5.9,<6",
    "ipykernel>=6.29,<7",
    "pytest>=8,<9",
    "ruff>=0.6,<1",
]

[project.scripts]
lfp-analysis = "lfp_analysis.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
