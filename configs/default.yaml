project:
  schema_version: "0.1"
  study_species: mouse
  input_format: fif
  data_status: real_sample_available_outside_workspace

expected_data:
  # These are checks, not assertions about a file until that file is read.
  sampling_rate_hz: 1000.0
  n_channels: 16
  n_times_per_epoch: 5000
  nominal_epoch_duration_s: 5.0
  # Current sample metadata reported 1 Hz high-pass and 200 Hz low-pass.
  # Keep these as checks/annotations until preprocessing history is confirmed per file.
  preprocessed_highpass_hz: 1.0
  preprocessed_lowpass_hz: 200.0
  preprocessing_history_confirmed: false
  reference_description: "采集时参考；颅骨参考、接地；四脑区共用参考电极（按当前研究说明）"

quality:
  flat_std_threshold: 1.0e-15
  max_abs_z_threshold: 20.0
  saturation_fraction_threshold: 0.01
  duplicate_epoch_detection: true
  line_noise_hz: [50.0, 60.0]
  line_noise_peak_ratio_threshold: 8.0
  check_frequency_band_hz: [1.0, 200.0]

psd:
  # Welch is the default. Multitaper is an alternative estimator and must be
  # enabled deliberately after checking its smoothing bandwidth and grid.
  method: welch
  fmin_hz: 1.0
  fmax_hz: 200.0
  nperseg: 1000
  noverlap: 500
  window: hann
  detrend: constant
  scaling: density
  average: mean
  multitaper_bandwidth_hz: 4.0
  multitaper_adaptive: false
  multitaper_low_bias: true
  multitaper_normalization: length
  multitaper_remove_dc: true
  multitaper_n_jobs: 1

bands:
  # 起步配置，需结合小鼠数据、研究问题和预注册方案核查。
  delta: [1.0, 4.0]
  theta: [4.0, 8.0]
  alpha: [8.0, 12.0]
  beta: [12.0, 30.0]
  low_gamma: [30.0, 55.0]
  high_gamma: [65.0, 100.0]

relative_power:
  denominator_hz: [1.0, 100.0]
  exclude_line_noise_hz: []

parameterization:
  enabled: true
  backend: specparam
  aperiodic_mode: fixed
  fit_range_hz: [2.0, 150.0]
  peak_width_limits_hz: [1.0, 12.0]
  max_n_peaks: 6
  min_peak_height: 0.0
  min_peak_prominence: 0.0
  min_r_squared: 0.90

connectivity:
  enabled: true
  methods: [mic, mim, wpli2_debiased]
  mode: multitaper
  fmin_hz: 2.0
  fmax_hz: 100.0
  fdecim: 1
  mt_bandwidth_hz: 4.0
  mt_adaptive: false
  mt_low_bias: true
  n_components: 1
  n_jobs: 1
  min_epochs: 5
  rank_strategy: data_driven_energy_99pct
  rank_relative_tolerance: 1.0e-6
  rank_variance_threshold: 0.99
  fixed_rank_by_region: {}
  exclude_line_noise_hz: [50.0, 60.0]
  line_noise_half_width_hz: 0.5
  bands_from_global_config: true
  rank_sensitivity_offsets: [-1, 0, 1]
  rank_sensitivity_enabled: true
  stability_enabled: true
  stability_subsample_fraction: 0.75
  stability_n_subsamples: 2
  stability_seed: 20260906
  granger:
    enabled: false
  # Bivariate region summaries: mean or median across valid channel pairs.
  region_pair_summary: mean

time_delay:
  # PyBispectra bispectrum-based TDE; this is a configurable starting analysis,
  # not a confirmed biological delay window or frequency band definition.
  enabled: true
  backend: pybispectra
  methods: [1]
  antisymmetrized: [false, true]
  min_epochs: 5
  # TDE-only anti-aliased resampling keeps the original FIF unchanged.
  analysis_sfreq_hz: 200.0
  resample_window: kaiser
  fft_window: hamming
  n_points: null
  max_delay_ms: 1000.0
  fmin_hz: 2.0
  fmax_hz: 80.0
  frequency_bands:
    broadband: [2.0, 80.0]
    delta: [2.0, 4.0]
    theta: [4.0, 8.0]
    alpha: [8.0, 12.0]
    beta: [12.0, 30.0]
    low_gamma: [30.0, 55.0]
    high_gamma: [65.0, 80.0]
  n_jobs: 1
  primary_method: 1
  primary_antisymmetrized: true
  quality_boundary_margin_ms: 10.0
  quality_max_channel_pair_mad_ms: 100.0

statistics:
  animal_unit: animal_id
  primary_comparison: null
  multiple_comparison_method: null
  inferential_model: not_configured

plotting:
  dpi: 150
  preview_format: png
  editable_format: svg
  max_waveform_epochs: 6
  waveform_seconds: 1.0
